<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quantum Celular</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--bg:#0b1220;--card:#111a2e;--borda:#1e2a44;--txt:#e5e7eb;--sub:#94a3b8;--verde:#22c55e;--verm:#ef4444;--azul:#38bdf8;--amar:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.95);backdrop-filter:blur(8px);padding:12px 16px 10px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:10px}
header b{font-size:17px;letter-spacing:.3px}header b i{font-style:normal;color:var(--azul)}
#st{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}#st i{width:9px;height:9px;border-radius:50%;background:#64748b;display:inline-block}
#st.on i{background:var(--verde);box-shadow:0 0 8px var(--verde)}#st.off i{background:var(--verm)}
main{padding:14px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0}.pos{color:var(--verde)}.neg{color:var(--verm)}.zero{color:var(--txt)}
.lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.grid div{background:#0d1526;border-radius:10px;padding:8px}.grid b{display:block;font-size:16px}
canvas{width:100%;height:190px;display:block}
.auto{display:grid;grid-template-columns:1fr auto;gap:4px 10px}.auto h3{margin:0;font-size:16px}.auto .sub{font-size:12.5px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:4px}
.t-run{background:#052e1a;color:#4ade80}.t-off{background:#1f2937;color:#9ca3af}.t-wait{background:#3a2e05;color:#fde047}.t-sim{background:#0c2a43;color:#7dd3fc}.t-mt5{background:#3b0d0d;color:#fca5a5}
.vals{text-align:right;font-size:13px;color:var(--sub)}.vals b{font-size:17px;display:block}
.bts{grid-column:1/3;display:flex;gap:8px;margin-top:8px}
button{font:inherit;border:0;border-radius:10px;padding:11px 12px;font-weight:700;cursor:pointer;flex:1}
.b-pausa{background:#1e293b;color:var(--txt);border:1px solid #334155}.b-enc{background:#7f1d1d;color:#fecaca}.b-todas{background:#1e293b;color:var(--amar);border:1px solid #475569;width:100%}
button:disabled{opacity:.45}
.op{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--borda);font-size:13.5px}.op:last-child{border:0}
.lado{font-weight:800;font-size:12px;padding:3px 7px;border-radius:6px;align-self:start}.lado.C{background:#0c2a43;color:#7dd3fc}.lado.V{background:#3a1d05;color:#fdba74}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,21,38,.97);border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav b{flex:1;text-align:center;padding:9px 0 8px;font-size:12px;color:var(--sub);cursor:pointer}nav b span{display:block;font-size:20px}nav b.on{color:var(--azul)}
.vazio{color:var(--sub);text-align:center;padding:24px 8px}
.aviso{background:#3a2e05;color:#fde68a;border:1px solid #713f12;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}#modal.on{display:flex}
#modal div{background:var(--card);border-top:1px solid var(--borda);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:720px;margin:0 auto}
#modal h3{margin:0 0 6px}#modal p{color:var(--sub);margin:0 0 14px}#modal .bts{grid-column:auto}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0f172a;border:1px solid #334155;padding:10px 14px;border-radius:10px;font-size:13px;display:none;z-index:10;max-width:90%}
.inicio{padding:40px 22px;text-align:center}.inicio h2{margin:12px 0 8px}.inicio p{color:var(--sub)}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>
<header><b>Quantum <i>Celular</i></b><span id="st"><i></i><span>conectando…</span></span></header>
<main>
 <div id="semCodigo" class="inicio" style="display:none">
  <div style="font-size:52px">📱</div><h2>Conecte este celular</h2>
  <p>No computador, abra o Quantum Trading › menu <b>Opções</b> › <b>📱 Conectar celular</b>, ligue o envio e aponte a câmera para o QR code.</p>
 </div>
 <div id="app" style="display:none">
  <div id="avisoPc"></div>
  <section class="sec on" id="s-hoje">
   <div class="card"><div class="lbl">Resultado do dia · automações</div><div class="big" id="hDia">–</div>
    <div class="grid"><div><span class="lbl">Aberto</span><b id="hAberto">–</b></div><div><span class="lbl">Operações</span><b id="hOps">–</b></div><div><span class="lbl">Acerto</span><b id="hAcerto">–</b></div></div></div>
   <div class="card"><div class="lbl">Curva do dia</div><canvas id="curva"></canvas></div>
   <div class="card"><div class="lbl">Por automação (hoje)</div><canvas id="barras"></canvas></div>
   <div class="card" id="cConta"></div>
  </section>
  <section class="sec" id="s-autos"><div id="listaAutos"></div><button class="b-todas" id="bTodas">⏸ Pausar todas as automações</button></section>
  <section class="sec" id="s-ops"><div class="card" id="listaOps"></div></section>
 </div>
</main>
<nav id="nav" style="display:none"><b class="on" data-s="hoje"><span>📊</span>Hoje</b><b data-s="autos"><span>🤖</span>Automações</b><b data-s="ops"><span>📋</span>Operações</b></nav>
<div id="modal"><div><h3 id="mT"></h3><p id="mP"></p><div class="bts"><button class="b-pausa" id="mNao">Cancelar</button><button class="b-enc" id="mSim">Confirmar</button></div></div></div>
<div id="toast"></div>
<script>
// Quantum Celular: lê o resumo que a plataforma do PC manda ao servidor (Supabase) e pede para pausar/encerrar automações.
// O código secreto vem do QR code (#c=...), fica só neste celular (localStorage) e é o que dá acesso. Chave abaixo = pública.
const SRV = 'https://oinnymfgcfqryhlilgrh.supabase.co/rest/v1/rpc/', CHAVE = 'sb_publishable_zoIUVayLtlF6laeImPxFMQ_SXT2s9UJ';
const $ = id => document.getElementById(id);
let COD = null, D = null, ULT = null, ABA = 'hoje', ESPERA = {};
try { const m = /[#&]c=([^&]+)/.exec(location.hash); if (m) { localStorage.setItem('qc_codigo', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); } COD = localStorage.getItem('qc_codigo'); } catch (e) {}
const rpc = (f, corpo) => fetch(SRV + f, {method: 'POST', headers: {apikey: CHAVE, 'Content-Type': 'application/json'}, body: JSON.stringify(corpo)})
 .then(async r => { const t = await r.text(); if (!r.ok) throw new Error((JSON.parse(t || '{}').message) || r.status); return t ? JSON.parse(t) : null; });
const brl = v => (v < 0 ? '−' : v > 0 ? '+' : '') + 'R$ ' + Math.abs(v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
const hora = s => new Date(s * 1000).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500); }

async function atualiza() {
 if (!COD) { $('semCodigo').style.display = 'block'; $('st').className = ''; $('st').lastChild.textContent = 'sem conexão'; return; }
 try {
  const r = await rpc('qt_ler', {p_token: COD});
  if (!r) { $('semCodigo').style.display = 'block'; $('app').style.display = $('nav').style.display = 'none'; $('st').className = 'off'; $('st').lastChild.textContent = 'código inválido'; return; }
  D = r.dados || {}; ULT = r; desenha();
 } catch (e) { $('st').className = 'off'; $('st').lastChild.textContent = 'sem internet'; }
}
function desenha() {
 $('semCodigo').style.display = 'none'; $('app').style.display = 'block'; $('nav').style.display = 'flex';
 const atraso = (new Date(ULT.agora) - new Date(ULT.atualizado)) / 1000, on = atraso < 30;
 $('st').className = on ? 'on' : 'off'; $('st').lastChild.textContent = on ? 'PC ao vivo' : 'PC offline · ' + new Date(ULT.atualizado).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
 $('avisoPc').innerHTML = on ? '' : `<div class="aviso">⚠ A plataforma do PC não manda dados há ${atraso > 3600 ? Math.round(atraso / 3600) + ' h' : Math.round(atraso / 60) + ' min'}. Os valores abaixo são do último envio. Pedidos só são feitos com o PC ligado e a plataforma aberta.</div>`;
 const autos = D.autos || [], ops = (D.hoje || []).slice().sort((a, b) => a.t - b.t);
 const dia = autos.reduce((s, a) => s + (a.dia || 0), 0), aberto = autos.reduce((s, a) => s + (a.aberto || 0), 0), ganhos = ops.filter(o => o.pnl > 0).length;
 $('hDia').textContent = brl(dia); $('hDia').className = 'big ' + cls(dia);
 $('hAberto').textContent = brl(aberto); $('hAberto').className = cls(aberto);
 $('hOps').textContent = ops.length; $('hAcerto').textContent = ops.length ? Math.round(ganhos / ops.length * 100) + '%' : '–';
 const c = D.conta, m = D.manual || {};
 $('cConta').innerHTML = `<div class="lbl">Conta e operações manuais</div>` + (c ? `<div style="margin-top:6px">MT5 ${esc(c.login)}${c.demo ? ' (demo)' : ''} · Saldo <b>${esc(c.moeda)} ${Number(c.saldo).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</b> · Patrimônio <b>${Number(c.patrimonio).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</b></div>` : '<div class="sub" style="margin-top:6px;color:var(--sub)">MT5 desconectado</div>')
  + `<div style="margin-top:6px">Manual hoje: Simulação <b class="${cls(m.sim)}">${brl(m.sim || 0)}</b>${m.mt5 != null ? ` · MT5 <b class="${cls(m.mt5)}">${brl(m.mt5)}</b>` : ''}</div>`;
 curva(ops); barras(autos);
 // automações
 const ord = autos.slice().sort((a, b) => (b.on - a.on) || (a.nome || '').localeCompare(b.nome || ''));
 $('listaAutos').innerHTML = ord.map(a => {
  const est = !a.on ? '<span class="tag t-off">■ Parada</span>' : /^rodando/i.test(a.estado) ? '<span class="tag t-run">● Rodando</span>' : `<span class="tag t-wait">${esc((a.estado || 'ligada').split('(')[0].slice(0, 40))}</span>`;
  const pend = ESPERA[a.id];
  return `<div class="card auto"><div><h3>${esc(a.nome)}</h3><div class="sub">${esc(a.estrategia)} · ${esc(a.sym)} ${esc(a.tf)}m</div><div style="margin-top:6px">${est}<span class="tag ${a.conta === 'MT5' ? 't-mt5' : 't-sim'}">${a.conta === 'MT5' ? 'MT5' : 'Simulação'}</span></div></div>
   <div class="vals">Dia<b class="${cls(a.dia)}">${brl(a.dia)}</b>${a.pos && a.pos !== 'Zerado' ? `${esc(a.pos)} · <span class="${cls(a.aberto)}">${brl(a.aberto)}</span>` : 'Zerada'}<br>${a.ops} op.</div>
   <div class="bts">${pend ? `<button disabled>⏳ ${esc(pend)}</button>` : `<button class="b-pausa" data-p="${a.id}" ${a.on ? '' : 'disabled'}>⏸ Pausar</button><button class="b-enc" data-e="${a.id}" ${a.on || (a.pos && a.pos !== 'Zerado') ? '' : 'disabled'}>⛔ Encerrar</button>`}</div></div>`;
 }).join('') || '<div class="card vazio">Nenhuma automação configurada na plataforma.</div>';
 $('bTodas').disabled = !autos.some(a => a.on);
 // operações
 $('listaOps').innerHTML = ops.length ? ops.slice().reverse().map(o => `<div class="op"><span class="lado ${o.lado}">${o.lado === 'C' ? 'COMPRA' : 'VENDA'}</span>
   <div><b>${esc(o.nome)}</b><div style="color:var(--sub);font-size:12.5px">${esc(o.sym)} · ${o.qtd} · ${hora(o.t0 || o.t)}→${hora(o.t)} · ${esc(o.motivo)}</div></div><b class="${cls(o.pnl)}">${brl(o.pnl)}</b></div>`).join('')
  : '<div class="vazio">Nenhuma operação encerrada hoje.</div>';
 // pedidos concluídos
 (ULT.cmds || []).forEach(c => { if (ESPERA[c.alvo] && c.feito && ESPERA['n' + c.alvo] === c.n) { delete ESPERA[c.alvo]; delete ESPERA['n' + c.alvo]; toast('✔ ' + (c.resultado || 'feito').replace(/^ok: /, '')); } });
}
function fit(cv) { const r = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; cv.width = w * r; cv.height = h * r; const g = cv.getContext('2d'); g.setTransform(r, 0, 0, r, 0, 0); return [g, w, h]; }
function curva(ops) {
 const [g, w, h] = fit($('curva')); g.clearRect(0, 0, w, h);
 if (!ops.length) { g.fillStyle = '#64748b'; g.font = '13px sans-serif'; g.textAlign = 'center'; g.fillText('Sem operações encerradas hoje', w / 2, h / 2); return; }
 let acc = 0; const pts = [[ops[0].t0 || ops[0].t, 0]].concat(ops.map(o => [o.t, acc += o.pnl]));
 const t0 = pts[0][0], t1 = Math.max(pts[pts.length - 1][0], t0 + 60), vs = pts.map(p => p[1]), mx = Math.max(0, ...vs), mn = Math.min(0, ...vs), pad = (mx - mn) * .12 || 10;
 const X = t => 8 + (t - t0) / (t1 - t0) * (w - 16), Y = v => 10 + (mx + pad - v) / (mx - mn + 2 * pad) * (h - 30);
 g.strokeStyle = '#334155'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(w, Y(0)); g.stroke(); g.setLineDash([]);
 [[1, '#22c55e'], [-1, '#ef4444']].forEach(([s, cor]) => {           // área verde acima do zero e vermelha abaixo
  g.save(); g.beginPath(); s > 0 ? g.rect(0, 0, w, Y(0)) : g.rect(0, Y(0), w, h); g.clip();
  g.beginPath(); g.moveTo(X(pts[0][0]), Y(0)); pts.forEach(([t, v]) => g.lineTo(X(t), Y(v))); g.lineTo(X(pts[pts.length - 1][0]), Y(0)); g.closePath();
  g.fillStyle = cor + '33'; g.fill(); g.beginPath(); pts.forEach(([t, v], i) => i ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v))); g.strokeStyle = cor; g.lineWidth = 2.2; g.stroke(); g.restore();
 });
 g.fillStyle = '#94a3b8'; g.font = '11px sans-serif'; g.textAlign = 'left'; g.fillText(hora(t0), 4, h - 4); g.textAlign = 'right'; g.fillText(hora(t1), w - 4, h - 4);
 g.fillText(brl(acc), w - 4, 12);
}
function barras(autos) {
 const cv = $('barras'), lst = autos.filter(a => a.dia || a.ops).sort((a, b) => b.dia - a.dia);
 cv.style.height = Math.max(60, lst.length * 30 + 10) + 'px';
 const [g, w, h] = fit(cv); g.clearRect(0, 0, w, h);
 if (!lst.length) { g.fillStyle = '#64748b'; g.font = '13px sans-serif'; g.textAlign = 'center'; g.fillText('Nenhuma automação operou hoje', w / 2, h / 2); return; }
 const mx = Math.max(...lst.map(a => Math.abs(a.dia)), 1), meio = w * .55, larg = w * .43;
 lst.forEach((a, i) => { const y = 6 + i * 30, v = a.dia, bw = Math.abs(v) / mx * (larg - 70);
  g.fillStyle = '#cbd5e1'; g.font = '12px sans-serif'; g.textAlign = 'right'; g.fillText((a.nome || '').slice(0, 26), meio - 8, y + 15);
  g.fillStyle = v >= 0 ? '#22c55e' : '#ef4444'; g.fillRect(meio, y + 4, Math.max(2, bw), 16);
  g.fillStyle = v >= 0 ? '#4ade80' : '#f87171'; g.textAlign = 'left'; g.fillText(brl(v), meio + Math.max(2, bw) + 6, y + 16); });
}
function confirma(titulo, texto, fn) { $('mT').textContent = titulo; $('mP').textContent = texto; $('modal').classList.add('on'); $('mSim').onclick = () => { $('modal').classList.remove('on'); fn(); }; }
$('mNao').onclick = () => $('modal').classList.remove('on');
async function pede(acao, alvo, rot) {
 try { const n = await rpc('qt_comandar', {p_token: COD, p_acao: acao, p_alvo: alvo}); if (alvo != null) { ESPERA[alvo] = rot; ESPERA['n' + alvo] = n; } toast('Pedido enviado ao PC…'); desenha(); setTimeout(atualiza, 2500); }
 catch (e) { toast('Não foi possível: ' + e.message); }
}
document.addEventListener('click', e => {
 const t = e.target.closest('[data-p],[data-e],[data-s]'); if (!t) return;
 const a = (D && D.autos || []).find(x => String(x.id) === (t.dataset.p || t.dataset.e));
 if (t.dataset.s) { ABA = t.dataset.s; document.querySelectorAll('nav b').forEach(b => b.classList.toggle('on', b === t)); document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + ABA)); if (D) desenha(); }
 else if (t.dataset.p && a) confirma('Pausar "' + a.nome + '"?', 'Ela para de abrir operações novas. Uma posição aberta continua com o stop e o alvo.', () => pede('pausar', a.id, 'pausando…'));
 else if (t.dataset.e && a) confirma('Encerrar "' + a.nome + '"?', 'Pausa a automação e ZERA a posição dela a mercado' + (a.conta === 'MT5' ? ' na conta MT5 (ordem real).' : ' (Simulação).'), () => pede('zerar', a.id, 'encerrando…'));
});
$('bTodas').onclick = () => confirma('Pausar todas?', 'Todas as automações param de abrir operações novas. As posições abertas continuam com stop e alvo.', () => pede('pausar_todas', null));
atualiza(); setInterval(atualiza, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualiza(); });
</script>
</body>
</html>
